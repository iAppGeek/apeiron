name: Images

# Builds every service image for linux/amd64 and linux/arm64 on native runners (no QEMU), pushes each platform by
# digest, then merges the two into one multi-arch manifest per service.
#
# Registry: GHCR by default (free, GITHUB_TOKEN). Set the repo variable REGISTRY_KIND=ecr and AWS_ROLE_ARN to push
# to Amazon ECR through GitHub OIDC instead (see docs/hosting.md). Not run on every push, to save minutes.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  config:
    name: Resolve registry
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.pick.outputs.kind }}
      registry: ${{ steps.pick.outputs.registry }}
      region: ${{ steps.pick.outputs.region }}
    steps:
      - id: pick
        env:
          REGISTRY_KIND: ${{ vars.REGISTRY_KIND }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          kind="${REGISTRY_KIND:-ghcr}"
          region="${AWS_REGION:-eu-west-2}"
          if [ "$kind" = "ecr" ] && [ -z "$AWS_ROLE_ARN" ]; then
            echo "::warning::REGISTRY_KIND=ecr but AWS_ROLE_ARN is not set; falling back to GHCR"
            kind=ghcr
          fi
          if [ "$kind" = "ecr" ]; then
            account="$(cut -d: -f5 <<<"$AWS_ROLE_ARN")"
            registry="${account}.dkr.ecr.${region}.amazonaws.com"
          else
            kind=ghcr
            registry="ghcr.io/${OWNER,,}"
          fi
          {
            echo "kind=$kind"
            echo "registry=$registry"
            echo "region=$region"
          } >>"$GITHUB_OUTPUT"
          echo "Pushing to $kind: $registry" >>"$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.service }} (${{ matrix.arch }})
    needs: config
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [antikythera, hermes, gaia, talos, pharos]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: needs.config.outputs.kind == 'ghcr'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        if: needs.config.outputs.kind == 'ecr'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ needs.config.outputs.region }}

      - name: Log in to ECR
        if: needs.config.outputs.kind == 'ecr'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service == 'pharos' && 'infra/docker/web.Dockerfile' || 'infra/docker/Dockerfile' }}
          build-args: ${{ matrix.service != 'pharos' && format('APP={0}', matrix.service) || '' }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ needs.config.outputs.registry }}/apeiron/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Manifest ${{ matrix.service }}
    needs: [config, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [antikythera, hermes, gaia, talos, pharos]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: needs.config.outputs.kind == 'ghcr'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        if: needs.config.outputs.kind == 'ecr'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ needs.config.outputs.region }}

      - name: Log in to ECR
        if: needs.config.outputs.kind == 'ecr'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.config.outputs.registry }}/apeiron/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Create the multi-arch manifest
        env:
          IMAGE: ${{ needs.config.outputs.registry }}/apeiron/${{ matrix.service }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/digests"
          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON")"
          # Word splitting is intended: one -t flag per tag, one image@digest argument per platform.
          # shellcheck disable=SC2086,SC2046
          docker buildx imagetools create $tags $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: |
          set -euo pipefail
          tag="$(jq -r '.tags[0]' <<<"$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$tag" | tee -a "$GITHUB_STEP_SUMMARY"
