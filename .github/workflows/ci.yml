name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('packages/mnemosyne/package.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh

  e2e:
    name: e2e (containerised stack, 200k rows)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # A smaller dataset seeds in seconds; the tests only need it to be big enough to scroll and group.
      SEED_ROWS: "200000"
      E2E_MIN_ROWS: "150000"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @apeiron/e2e exec playwright install --with-deps chromium
      - name: Build the images
        run: docker compose --profile core --profile seed build
      - name: Start MongoDB and NATS
        run: docker compose --profile core up -d --no-build --wait --wait-timeout 180 mongo nats
      - name: Seed ${{ env.SEED_ROWS }} orders
        run: docker compose --profile core --profile seed run --rm gaia
      - name: Start the stack
        run: docker compose --profile core up -d --no-build --wait --wait-timeout 600
      - name: Health
        run: curl -fsS localhost:4000/health && curl -fsSI localhost:8080/ | head -1
      - name: End-to-end tests
        run: pnpm e2e:ci
      - name: Build the workspace packages the resilience driver imports
        run: pnpm --filter "@apeiron/e2e^..." build
      - name: Build the resilience images (web with test hooks)
        run: docker compose --profile core --profile resilience build pharos-e2e
      - name: Start toxiproxy and the test-hooks web
        run: docker compose --profile core --profile resilience up -d --no-build --wait --wait-timeout 120 toxiproxy pharos-e2e
      - name: Resilience smoke (S1 shortened, S3)
        run: pnpm e2e:resilience:smoke
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Upload the resilience results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resilience-results
          path: e2e/results
          if-no-files-found: ignore
          retention-days: 14
      - name: Container logs
        if: failure()
        run: docker compose --profile core --profile resilience logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose --profile core --profile seed --profile resilience down -v
