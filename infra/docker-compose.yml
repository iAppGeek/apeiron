name: apeiron

# Profiles: core | seed | monitoring | loadtest | edge
# Paths are resolved against the repo root (project_directory in /compose.yaml).
services:
  mongo:
    image: mongo:8
    profiles: [core, seed]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    profiles: [core]
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  gaia:
    profiles: [seed]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: gaia
    image: ${REGISTRY:-local}/apeiron/gaia:${TAG:-dev}
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-blotter}
      SEED_ROWS: ${SEED_ROWS:-1000000}
      SEED: ${SEED:-42}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

volumes:
  mongo-data:
  nats-data:
