name: apeiron

# Profiles: core | seed | monitoring | loadtest | edge
# Paths are resolved against the repo root (project_directory in /compose.yaml).
services:
  mongo:
    image: mongo:9.0
    profiles: [core, seed]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  nats:
    image: nats:2.15-alpine
    profiles: [core]
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  antikythera:
    profiles: [core]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: antikythera
    image: ${REGISTRY:-local}/apeiron/antikythera:${TAG:-dev}
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-blotter}
      DB_ADAPTER: ${DB_ADAPTER:-mongo}
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_OPTIONS: --max-old-space-size=3072
      LOAD_BATCH_SIZE: ${LOAD_BATCH_SIZE:-200}
    # Caps the container so memory behaviour is defined (and matches the remote box budget).
    mem_limit: 3g
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  gaia:
    profiles: [seed]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: gaia
    image: ${REGISTRY:-local}/apeiron/gaia:${TAG:-dev}
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-blotter}
      SEED_ROWS: ${SEED_ROWS:-1000000}
      SEED: ${SEED:-42}
      SEED_NOW: ${SEED_NOW:-}
      BATCH_SIZE: ${BATCH_SIZE:-10000}
      SEED_RESET: ${SEED_RESET:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

volumes:
  mongo-data:
  nats-data:
