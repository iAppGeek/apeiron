name: apeiron

# Profiles: core | seed | monitoring | loadtest | edge
# Paths are resolved against the repo root (project_directory in /compose.yaml).
services:
  mongo:
    image: mongo:9.0
    profiles: [core, seed]
    # WiredTiger defaults to half of the Docker VM's RAM, which under sustained write-behind load starves the
    # blotter server (the VM swapped and every container stalled). MONGO_CACHE_GB (default 1) caps it; 1 GB holds
    # the working set of this dataset. Raise it on a bigger host (the 16 GB remote box).
    command: ["--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-1}"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  nats:
    image: nats:2.15-alpine
    profiles: [core]
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  antikythera:
    profiles: [core]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: antikythera
    image: ${REGISTRY:-local}/apeiron/antikythera:${TAG:-dev}
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-blotter}
      DB_ADAPTER: ${DB_ADAPTER:-mongo}
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_OPTIONS: --max-old-space-size=3072
      LOAD_BATCH_SIZE: ${LOAD_BATCH_SIZE:-200}
      NATS_URL: nats://nats:4222
      FLUSH_MS: ${FLUSH_MS:-50}
      FLUSH_BUDGET_MS: ${FLUSH_BUDGET_MS:-40}
      WRITE_BEHIND_MS: ${WRITE_BEHIND_MS:-500}
      MAX_TRACKED_BLOCKS: ${MAX_TRACKED_BLOCKS:-100}
      LOAD_PRESET: ${LOAD_PRESET:-medium}
    # Caps the container so memory behaviour is defined (and matches the remote box budget).
    mem_limit: 3g
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  hermes:
    profiles: [core]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: hermes
    image: ${REGISTRY:-local}/apeiron/hermes:${TAG:-dev}
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-blotter}
      NATS_URL: nats://nats:4222
      LOAD_PRESET: ${LOAD_PRESET:-medium}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTH_PORT: "4100"
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  pharos:
    profiles: [core]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: ${REGISTRY:-local}/apeiron/pharos:${TAG:-dev}
    ports:
      - "${WEB_BIND:-127.0.0.1}:8080:8080"
    depends_on:
      antikythera:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  prometheus:
    profiles: [monitoring]
    # Newest stable release (the image has no floating minor tag, so the patch is pinned).
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.2
    environment:
      # Anonymous visitors get the Viewer role so the dashboard opens without a login. Local use only:
      # the port is bound to 127.0.0.1. Admin sign-in (admin / GRAFANA_ADMIN_PASSWORD) is still needed to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/apeiron-blotter-server.json
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  talos:
    profiles: [loadtest]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: talos
    image: ${REGISTRY:-local}/apeiron/talos:${TAG:-dev}
    # Needs the core profile too:  docker compose --profile core --profile loadtest run --rm talos
    command:
      - node
      - dist/index.js
      - --clients
      - "${TALOS_CLIENTS:-50}"
      - --duration
      - "${TALOS_DURATION:-300}"
      - --codec
      - ${TALOS_CODEC:-json}
      - --seed
      - "${TALOS_SEED:-1}"
      - --url
      - ws://antikythera:4000/ws
      - --metrics
      - http://antikythera:4000/metrics
      - --out
      - /results
    volumes:
      - ./loadtest/results:/results
    depends_on:
      antikythera:
        condition: service_healthy
    restart: "no"

  gaia:
    profiles: [seed]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: gaia
    image: ${REGISTRY:-local}/apeiron/gaia:${TAG:-dev}
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-blotter}
      SEED_ROWS: ${SEED_ROWS:-1000000}
      SEED: ${SEED:-42}
      SEED_NOW: ${SEED_NOW:-}
      BATCH_SIZE: ${BATCH_SIZE:-10000}
      SEED_RESET: ${SEED_RESET:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

volumes:
  mongo-data:
  nats-data:
  prometheus-data:
