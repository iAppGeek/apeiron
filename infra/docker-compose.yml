name: apeiron

# Profiles: core | seed | monitoring | loadtest | edge | resilience
# Paths are resolved against the repo root (project_directory in /compose.yaml).
services:
  mongo:
    image: mongo:9.0
    profiles: [core, seed]
    # WiredTiger defaults to half of the Docker VM's RAM, which under sustained write load starves the
    # blotter server (the VM swapped and every container stalled). MONGO_CACHE_GB (default 1) caps it; 1 GB holds
    # the working set of this dataset. Raise it on a bigger host (the 16 GB remote box).
    command: ["--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-1}"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  nats:
    image: nats:2.15-alpine
    profiles: [core]
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  antikythera:
    profiles: [core]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: antikythera
    image: ${REGISTRY:-local}/apeiron/antikythera:${TAG:-dev}
    environment:
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_OPTIONS: --max-old-space-size=3072
      NATS_URL: nats://nats:4222
      PRICE_WAIT_MS: ${PRICE_WAIT_MS:-10000}
      CATCHUP_MAX_PENDING: ${CATCHUP_MAX_PENDING:-100}
      WARM_VIEWS: ${WARM_VIEWS:-default}
      WARM_ROUNDS: ${WARM_ROUNDS:-3}
      DRAIN_MS: ${DRAIN_MS:-2000}
      COMMAND_TIMEOUT_MS: ${COMMAND_TIMEOUT_MS:-5000}
      ACK_WAIT_V_MS: ${ACK_WAIT_V_MS:-2000}
      FLUSH_MS: ${FLUSH_MS:-50}
      FLUSH_BUDGET_MS: ${FLUSH_BUDGET_MS:-40}
      MAX_TRACKED_BLOCKS: ${MAX_TRACKED_BLOCKS:-100}
      LOAD_PRESET: ${LOAD_PRESET:-medium}
      ENTITLEMENTS_FILE: /config/entitlements.json
    volumes:
      - ./infra/config/entitlements.json:/config/entitlements.json:ro
    # Caps the container so memory behaviour is defined (and matches the remote box budget).
    mem_limit: 3g
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      nats:
        condition: service_healthy
      themis:
        condition: service_healthy
    healthcheck:
      # Ready means loaded, caught up, priced and warm (not just the process being up: that is /health/live).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  # The order service of record: owns the database and publishes every order's latest state to the ORDER_STATE
  # bucket. Healthy once the projection (the bucket's copy of every order) is complete, which takes about a
  # minute at 1M rows on first start.
  themis:
    profiles: [core]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: themis
    image: ${REGISTRY:-local}/apeiron/themis:${TAG:-dev}
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-blotter}
      NATS_URL: nats://nats:4222
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTH_PORT: "4200"
      GROUP_COMMIT_MS: ${GROUP_COMMIT_MS:-20}
      GROUP_COMMIT_MAX: ${GROUP_COMMIT_MAX:-500}
      REBUILD_PROJECTION: ${REBUILD_PROJECTION:-0}
      # The same value goes to hermes, which drops instructions older than this (themis has answered them TIMEOUT).
      VENUE_TIMEOUT_MS: ${VENUE_TIMEOUT_MS:-5000}
    mem_limit: 1g
    ports:
      - "127.0.0.1:4200:4200"
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 300s
    restart: unless-stopped

  # The price feed: a random walk per pair published as prices.<PAIR>. Knows nothing about orders. It starts each
  # walk from the last price on the PRICES stream (so a restart carries on), else from the order service's levels.
  helios:
    profiles: [core]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: helios
    image: ${REGISTRY:-local}/apeiron/helios:${TAG:-dev}
    environment:
      NATS_URL: nats://nats:4222
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTH_PORT: "4300"
      HELIOS_SEED: ${HELIOS_SEED:-}
    ports:
      - "127.0.0.1:4300:4300"
    # After themis, so a first start (no last price on the stream yet) can ask it for the open orders' levels
    # instead of giving up after 10 s and starting every pair at its reference level.
    depends_on:
      nats:
        condition: service_healthy
      themis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4300/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  hermes:
    profiles: [core]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: hermes
    image: ${REGISTRY:-local}/apeiron/hermes:${TAG:-dev}
    # No database: hermes is the venue. It loads the open orders from themis and sends submissions and execution reports.
    environment:
      NATS_URL: nats://nats:4222
      LOAD_PRESET: ${LOAD_PRESET:-medium}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTH_PORT: "4100"
      VENUE_TIMEOUT_MS: ${VENUE_TIMEOUT_MS:-5000}
    depends_on:
      nats:
        condition: service_healthy
      themis:
        condition: service_healthy
      helios:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  pharos:
    profiles: [core]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: ${REGISTRY:-local}/apeiron/pharos:${TAG:-dev}
    ports:
      - "${WEB_BIND:-127.0.0.1}:8080:8080"
    depends_on:
      antikythera:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Cloudflare Tunnel from the remote box (docs/hosting.md): dials out to Cloudflare, which serves pharos (and Grafana)
  # on their host names over HTTPS behind Access. The ingress rules live in infra/cloudflare, so no port is published.
  # Needs the core profile too, and TUNNEL_TOKEN. The image is distroless (no shell or wget), so there is no
  # healthcheck; the tunnel's health shows on the Zero Trust dashboard.
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.0
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      pharos:
        condition: service_healthy
    restart: unless-stopped

  # Resilience suite (docs/TESTING.md): the browser reaches antikythera only through toxiproxy, so the tests can
  # break, stall, slow and throttle the WebSocket. Needs the core profile too.
  toxiproxy:
    profiles: [resilience]
    # Latest release (v2.12.0); the image has no floating minor tag, so the patch is pinned.
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474"
    depends_on:
      antikythera:
        condition: service_healthy
    restart: unless-stopped

  # The same web image as pharos, built with the test hooks, with /ws going through toxiproxy.
  pharos-e2e:
    profiles: [resilience]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_TEST_HOOKS: "1"
    image: ${REGISTRY:-local}/apeiron/pharos-e2e:${TAG:-dev}
    environment:
      WS_UPSTREAM: toxiproxy:4100
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - toxiproxy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  prometheus:
    profiles: [monitoring]
    # Newest stable release (the image has no floating minor tag, so the patch is pinned).
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.2
    environment:
      # Anonymous visitors get the Viewer role so the dashboard opens without a login. Local use only:
      # the port is bound to 127.0.0.1. Admin sign-in (admin / GRAFANA_ADMIN_PASSWORD) is still needed to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/apeiron-blotter-server.json
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  talos:
    profiles: [loadtest]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: talos
    image: ${REGISTRY:-local}/apeiron/talos:${TAG:-dev}
    # Needs the core profile too:  docker compose --profile core --profile loadtest run --rm talos
    command:
      - node
      - dist/index.js
      - --clients
      - "${TALOS_CLIENTS:-50}"
      - --duration
      - "${TALOS_DURATION:-300}"
      - --codec
      - ${TALOS_CODEC:-json}
      - --seed
      - "${TALOS_SEED:-1}"
      - --url
      - ws://antikythera:4000/ws
      - --metrics
      - http://antikythera:4000/metrics
      - --out
      - /results
    volumes:
      - ./loadtest/results:/results
    depends_on:
      antikythera:
        condition: service_healthy
    restart: "no"

  gaia:
    profiles: [seed]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: gaia
    image: ${REGISTRY:-local}/apeiron/gaia:${TAG:-dev}
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-blotter}
      SEED_ROWS: ${SEED_ROWS:-1000000}
      SEED: ${SEED:-42}
      SEED_NOW: ${SEED_NOW:-}
      BATCH_SIZE: ${BATCH_SIZE:-10000}
      SEED_RESET: ${SEED_RESET:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

volumes:
  mongo-data:
  nats-data:
  prometheus-data:
